# ====================================================================
# БАЗОВЫЕ НАСТРОЙКИ СЕТИ И СИСТЕМЫ
# ====================================================================
# Обязательная пара к BBR, без fq BBR работает хуже
net.core.default_qdisc = fq
# Снижает задержки/буферблоат на прокси-трафике; это BBRv1 (mainline), см. выше
net.ipv4.tcp_congestion_control = bbr
# Базовая защита публичного сервера от SYN-flood
net.ipv4.tcp_syncookies = 1
# Loose-режим нужен только при policy routing / нескольких интерфейсах. На обычном одноинтерфейсном VPS дефолтный strict (1) безопаснее и достаточен
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
vm.swappiness = 10


# ====================================================================
# XRAY ОПТИМИЗАЦИИ И ТЮНИНГ ОЧЕРЕДЕЙ
# ====================================================================
# Xray как клиент открывает много исходящих соединений к апстримам — расширенный диапазон портов
net.ipv4.ip_local_port_range = 1024 65535
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Тайм-ауты TCP сокетов и управление скоростью
# Быстрее освобождает сокеты в FIN_WAIT2 при высокой частоте соединений
net.ipv4.tcp_fin_timeout = 15
# Критично для долгоживущих туннелей через мобильный NAT — быстрее детектит мёртвых клиентов
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
# Не даёт упасть в "time wait bucket table overflow" при высоком churn
net.ipv4.tcp_max_tw_buckets = 524288
# Xray как клиент делает много исходящих соединений — переиспользование TIME_WAIT ускоряет их
net.ipv4.tcp_tw_reuse = 1
# Быстрее чистит "осиротевшие" закрывающиеся сокеты
net.ipv4.tcp_orphan_retries = 2
# Не даёт терять throughput на "всплесковых" прокси-сессиях
net.ipv4.tcp_slow_start_after_idle = 0

# Оптимизация буферов памяти под сетевой трафик (1 МБ дефолт / 16 МБ макс)
# Без увеличенных буферов BBR не сможет "заполнить трубу" на высоких RTT
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 212992
net.core.wmem_default = 212992
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
net.ipv4.udp_mem = 65536 131072 262144
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Снижение задержек и тюнинг подсистемы виртуальной памяти (VM)
vm.dirty_ratio = 6
vm.dirty_background_ratio = 3

# Автоматическое определение оптимального MTU для стабильной работы
# через VPN, мобильные сети и туннели без ручной настройки MSS.
# Актуально при REALITY/TLS через провайдеров, режущих ICMP "fragmentation needed" — спасает от зависших соединений
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_mtu_probe_floor = 1024

# ====================================================================
# ОПТИМИЗАЦИЯ ДЛЯ UNIX DOMAIN SOCKETS (IPC) И ДЕСКРИПТОРОВ
# ====================================================================
# Это только системный потолок. Сам по себе ничего не даст, если в xray.service/nginx.service не прописан LimitNOFILE, а в nginx.conf — worker_rlimit_nofile
# Максимальное число открытых файлов/сокетов во всей системе
fs.file-max = 2097152
# Увеличиваем лимиты подсистемы inotify (если панель или сервисы следят за файлами в /dev/shm)
# Нужно, только если сверху стоит панель (3x-ui/Marzban/Remnawave), certbot-хуки или fail2ban со слежкой за логами. Голому xray+nginx не критично
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# Заставляет ядро буферизировать меньше данных на уровне сетевого стека, улучшая отзывчивость.
# Снижает bufferbloat для WebSocket/gRPC-транспортов, которые xray активно использует
net.ipv4.tcp_notsent_lowat = 16384
