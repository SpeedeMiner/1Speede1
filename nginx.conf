user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 524288;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}
# =========================================================================
# STREAM SECTION (Мультиплексирование порт 443 по SNI)
# =========================================================================
stream {
    # Карта распределения трафика на основе SNI (домена в TLS-запросе)
    map $ssl_preread_server_name $backend_gate {
	hostnames;
        yourdomane.online     nginx_http_backend;
		# Строго указанные домены маскировки отправляем на Reality
		taxi.yandex.ru       unix:/dev/shm/xray-reality.sock;
		www.amd.com			127.0.0.1:10445;
		intel.com			127.0.0.1:10446;
		www.bing.com		127.0.0.1:10447;
		nltimes.nl			127.0.0.1:10448;
		noordhollandsdagblad.nl	127.0.0.1:10449;
        #www.nu.nl     unix:/dev/shm/xray-reality.sock;
		f1tv.formula1.com     unix:/dev/shm/xray-reality2.sock;
		
        # Без default на xray: все остальные запросы (чужие SNI, сканеры, запросы по IP)
        # отправляем в Nginx, где их сбросит дефолтный сервер (ssl_reject_handshake)
        default                 nginx_http_backend;
    }

    # Локальный адрес вашего HTTP-сервера Nginx
    upstream nginx_http_backend {
        server unix:/dev/shm/nginx-http.sock;
    }

    server {
        listen 443 backlog=65535 reuseport so_keepalive=75s:5s:3;
		listen [::]:443 backlog=65535 reuseport so_keepalive=75s:5s:3;
		
		# 1. Согласование таймаутов (ставим равным или чуть больше таймаутов в http/location)
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
		proxy_buffer_size 16k;
        # 2. Быстрая реакция на зависшие клиентские TCP-сессии
        proxy_socket_keepalive on;
        proxy_protocol on;
		proxy_pass $backend_gate;
		ssl_preread on; # Читаем SNI без расшифровки TLS
    }
}
# =============================================================================
# Секция HTTP — основная веб-функциональность
# =============================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Базовые оптимизации
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    etag off;
    charset utf-8;
	resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
	resolver_timeout 5s;
	http2_recv_buffer_size 4m;
	
	# Определяет истинный IP даже для запросов, упавших на стадии Handshake (ошибка 400)
    map $proxy_protocol_addr $ak_real_ip {
        ""      $remote_addr;
        default $proxy_protocol_addr;
    }

    # =========================================================================
    # UPSTREAM & CACHE (Оптимизация соединений и кэша статики)
    # =========================================================================
    upstream panel_3xui {
        server 127.0.0.1:49467;
        keepalive 30;
    }
	upstream xray_vless {
    server 127.0.0.1:11443;
    keepalive 64 local;
	keepalive_timeout 1h;
	keepalive_requests 100000;
	}
	
	upstream xray_vless2 {
    server 127.0.0.1:9443;
    keepalive 64 local;
	keepalive_timeout 1h;
	keepalive_requests 100000;
	}
	upstream xray_vless3 {
    server 127.0.0.1:7443;
    keepalive 64 local;
	keepalive_timeout 1h;
	keepalive_requests 100000;
	}
	upstream animess_backend {
    zone animess_backend 256k;
    server animesss.com:443 resolve;
    keepalive 32;
	}

    proxy_cache_path /var/cache/nginx/img_cache levels=1:2 keys_zone=img_zone:10m max_size=1g inactive=7d use_temp_path=off;
	proxy_cache_path /var/cache/nginx/html_cache levels=1:2 keys_zone=html_zone:20m max_size=500m inactive=30d use_temp_path=off;
	
	# Формат логов с реальным IP
	log_format main '$ak_real_ip [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
	access_log /var/log/nginx/access.log main buffer=32k flush=60s;

   # Тайм-ауты для долгих соединений (VPN/стриминг)
    keepalive_timeout 75s;
    keepalive_requests 100000;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;
    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;
	set_real_ip_from unix:;

    client_max_body_size 8m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    client_header_buffer_size 1k;

    # Кэш открытых файлов
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;


    # =========================================================================
    # Логика защиты от ботов и сканирования
    # =========================================================================
    
    # Map для WebSocket/Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
	
    # Расширенная детекция плохих ботов и парсеров
    map $http_user_agent $badbot_raw {
        default 0;
        "" 1;
        # Утилиты и сканеры
        ~*(?:httpclient|lwp-request|go-http-client|axios|fetch|insomnia|postman|libwww-perl|java|php|ruby|nuclei|httpx|ffuf|dirsearch|gobuster) 1;
        # Агрессивные SEO/уязвимости
        ~*(?:sqlmap|nikto|masscan|zgrab|zmap|acunetix|dirbuster|wpscan|nmap|hydra|bfexam|censys|shodan|dirb|feroxbuster|katana) 1;
        ~*(?:ahrefs|semrush|mj12bot|dotbot|rogerbot|exabot|sogou|bytespider|yandexbot|pinterest|baidu|duckduckgo|bingbot|googlebot) 1;
        # AI-скрейперы
        ~*(?:gptbot|claudebot|chatgpt|cohere|omgili|anthropic|google-extended|applebot-extended|meta-externalagent|ccbot|perplexity|openai|perplexities|gemini|bard|anthropic-ai|commoncrawl|diffbot|weborama|bytespider-ai) 1;
		~*(?:facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot) 1;
   }
		
    # Продвинутая детекция сканирования URL (попытки доступа к служебным файлам)
    map $request_uri $is_scan_attempt {
        default 0;
        # Разрешаем конкретные страницы, несмотря на расширение .php
        ~^/(?:pages|public)/(pages|catalog|schedule|random|public|donate|team|login|cp)\.php$ 0;
        ~*\.(?:php|php5|phtml|asp|aspx|jsp|do|action|cgi|pl|py|rb)$ 1;
        ~*(\.env|\.git|\.config|\.htaccess|\.sql|\.bak|\.old|\.swp|\.ini|config\.php|web\.config|settings\.py)$ 1;
        ~*^/(?:admin|administrator|wp-admin|wp-login|phpmyadmin|sqladmin|setup|install|dashboard|manager|controlpanel|config|api/v1|auth|backend|logs)/ 1;
        ~*(\.\./|\.\.\\|/etc/passwd|/boot/|/windows/|/proc/) 1;
        ~*^/(?:graphql|swagger-ui|api-docs|redoc)/ 1;
        ~*\.(?:zip|tar\.gz|rar|7z)$ 1;
		~*(?:\.git/|wp-json|xmlrpc|/.env|config\.bak|debug\.log|test\.php) 1;
    }

    # Финальный вердикт с исключениями для рабочих путей панели и подписок
    map "$badbot_raw:$is_scan_attempt:$request_uri" $badbot {
    # Исключение для robots.txt (открыто для всех ботов и сканеров)
    ~^.*:/robots\.txt(\?|$) 0;
	~^.*:/.well-known/security.txt(\?|$) 0;

    # Исключение для панели 3x-ui
    ~^1:[01]:/video/bitrate/hls/JWtmpbDP9HYkGoPe 0;
    
    # Исключение для путей подписок клиентов (разрешаем работу скриптов/клиентов)
    ~^1:[01]:/stream/master/playlist/log_wUmniWfwl7zcVJUHcziXXSIHFzyscLZ9yeED 0;
    ~^1:[01]:/log_wUmniWfwl7zcVJUHcziXXSIHFzyscLZ9yeED 0;
    
    ~(^1:|:1) 1;
    default 0;
}

    # Логирование для отладки
    #log_format debug '$ak_real_ip realip=$realip_remote_addr proxy=$proxy_protocol_addr "$request" $status badbot=$badbot raw=$badbot_raw scan=$is_scan_attempt';
    #access_log /var/log/nginx/debug.log debug;

    # Зоны лимитов с белым списком для Xray
	limit_req_zone $limit_ip zone=bot:1m rate=4r/s;
	limit_req_zone $limit_ip zone=panel:10m rate=30r/s;
	limit_req_zone $limit_ip zone=subs:1m rate=2r/m;
	limit_req_zone $limit_ip zone=scan:1m rate=1r/s;
	limit_conn_zone $limit_ip zone=addr:1m;
	limit_req_zone $limit_ip zone=assets:1m rate=30r/s;
	limit_req_status 429;

    # Скрытие служебных заголовков
	proxy_hide_header X-Proxy-Engine;
	proxy_hide_header X-Original-URL;
	proxy_hide_header X-RateLimit-Remaining;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Via;
    proxy_hide_header X-Varnish;
    proxy_hide_header X-Varnish-Cache;
    proxy_hide_header Age;
	proxy_hide_header CF-Ray;
    proxy_hide_header CF-Cache-Status;
    proxy_hide_header Expect-CT;
    proxy_hide_header Report-To;
    proxy_hide_header NEL;
    proxy_hide_header Alt-Svc;
    proxy_hide_header X-Cache-Status;
	proxy_hide_header ETag;
	proxy_hide_header Vary;
	proxy_hide_header Server-Timing;
	proxy_hide_header X-Content-Type-Options;
	proxy_hide_header Set-Cookie;
	
	# Очистка служебных заголовков CDN-апстрима
	proxy_hide_header front-hostname;
	proxy_hide_header front-upstream;
	proxy_hide_header x-cache-cluster;
	proxy_hide_header x-server-proto;

	# Предотвращение дублирования с локальными add_header
	proxy_hide_header X-Frame-Options;
	proxy_hide_header Strict-Transport-Security;
	proxy_hide_header Referrer-Policy;
	proxy_hide_header Permissions-Policy;
	proxy_hide_header Feature-Policy;

    # =========================================================================
    # HTTP SERVERS (Порт 80: Защита и редирект)
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        access_log off;

        if ($badbot) { return 444; }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Защита от сканеров — сразу обрываем соединение для подозрительных путей
        location ~* ^/(wp-admin|wp-login|xmlrpc|vendor|cgi-bin) { return 444; }
        location ~* ^/(\.env|Dockerfile|composer\.json|composer\.lock|package\.json|yarn\.lock) { return 444; }
        location ~ /\.(git|env|htaccess|svn|DS_Store) { return 444; }
        location ~ /\. { return 444; }

        # Блокировка запросов без Host (часто идут от сканеров по IP)
        if ($host = "") { return 444; }

        location / {
            if ($host != "yourdomane.online") { return 444; }
            return 301 https://yourdomane.online$request_uri;
        }

        error_page 400 403 404 405 =404 /dev/null;
		}

    server {
        listen 80;
        listen [::]:80;
        server_name yourdomane.online;

        if ($badbot) { return 444; }
        if ($host = "") { return 444; }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
		error_page 400 403 404 405 =404 /dev/null;
    }

    # =========================================================================
    # HTTPS СЕРВЕР: SSL REJECT (Защита от сканирования по IP-адресу)
    # =========================================================================
    server {
        listen unix:/dev/shm/nginx-http.sock ssl default_server proxy_protocol;
        server_name _;

        ssl_reject_handshake on;
        ssl_session_tickets off;
        
        ssl_certificate /root/cert/yourdomane.online/fullchain.pem;
        ssl_certificate_key /root/cert/yourdomane.online/privkey.pem;
    }

    # =========================================================================
    # HTTPS СЕРВЕР: MAIN ENGINE (Основная рабочая конфигурация)
    # =========================================================================
    server {
        listen unix:/dev/shm/nginx-http.sock ssl proxy_protocol;
		http2 on;
		http2_max_concurrent_streams 1024;
		http2_chunk_size 16k;
        server_name yourdomane.online;

        # SSL-сертификаты
        ssl_certificate /root/cert/yourdomane.online/fullchain.pem;
        ssl_certificate_key /root/cert/yourdomane.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
		# Уменьшенный буфер для снижения задержки (TTFB)
		ssl_buffer_size 4k;
		# Сжатие сертификатов (RFC 8879)
		ssl_certificate_compression on;
		# Управление шифрами для TLS 1.3 (выбираются клиентом)
        ssl_prefer_server_ciphers off;
		# Кеширование и возобновление сессий
		ssl_session_tickets on;
        ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 15m;
		ssl_early_data on;
		# Отключаем OCSP (несовместим со сжатием сертификатов)
		ssl_stapling off;
		ssl_stapling_verify off;
		proxy_set_header Early-Data $ssl_early_data;

        # Безопасные заголовки
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # Глобальные интеллектуальные фильтры
        if ($is_scan_attempt) { return 404; }
        if ($badbot) { return 404; }
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
		if ($host != 'yourdomane.online') { return 444; }

        # Маскировка всех ошибок в единый 404
		proxy_intercept_errors on;
        error_page 400 403 404 405 @notfound;

        # =====================================================================
        # Локация 1: ПАНЕЛЬ 3X-UI
        # =====================================================================
        location = /video/bitrate/hls/JWtmpbDP9HYkGoPe {
            return 301 /video/bitrate/hls/JWtmpbDP9HYkGoPe/;
        }

        location /video/bitrate/hls/JWtmpbDP9HYkGoPe/ {
           
            proxy_pass https://panel_3xui/video/bitrate/hls/JWtmpbDP9HYkGoPe/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
			proxy_hide_header X-Cache-Status;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $ak_real_ip; 
            proxy_set_header X-Forwarded-For $ak_real_ip;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Отключение буферизации критично для работы WebSocket панели
            proxy_buffering off;
            proxy_request_buffering off;
			access_log off;
            error_log off;
			            
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
		# =====================================================================
        # Локация 2: ПОДПИСКИ КЛИЕНТОВ (страница подписки)
        # =====================================================================
		location ^~ /sub/ {
            proxy_pass https://127.0.0.1:49158;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			
			# Увеличение RAM-буферов для предотвращения записи на диск
            proxy_buffering on;
			proxy_buffer_size 128k;
			proxy_buffers 8 512k;
			proxy_busy_buffers_size 1024k;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
		
        # =====================================================================
        # Локация 2: ПОДПИСКИ КЛИЕНТОВ Путь
        # =====================================================================
        location ~* ^/(uploads|public|engine|templates)/ {

			root /var/www/mirror;
			try_files $uri @store_static;
			access_log off;
			expires 365d;
		}
		location @store_static {

			internal;
			proxy_pass https://animess_backend;
			proxy_store_access user:rw group:rw all:r;
			proxy_ignore_headers Vary Cache-Control Expires Set-Cookie;
			proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36";
			# SSL-настройки для Cloudflare
			proxy_ssl_server_name on;
			proxy_ssl_protocols TLSv1.2 TLSv1.3;
			proxy_ssl_session_reuse off; # Исключает сбросы сессий Anycast-нодами
			proxy_ssl_name animesss.com;
			proxy_set_header Host animesss.com;
			# Прозрачный перезапрос при сбое хэндшейка или 502
			proxy_next_upstream error timeout invalid_header http_502 http_503;
			proxy_next_upstream_tries 3;
			proxy_next_upstream_timeout 5s;
			proxy_set_header Accept-Encoding "";
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_store on;
			root /var/www/mirror;
			proxy_temp_path /var/www/proxy_temp;
		}

		# =====================================================================
        # Локация 3: — статические ресурсы
        # =====================================================================
		location ~* ^/(uploads|public|engine|templates)/ {

			root /var/www/mirror;
			try_files $uri @store_static;
			access_log off;
			expires 365d;
		}
		location @store_static {

			internal;
			proxy_pass https://animess_backend;
			proxy_store_access user:rw group:rw all:r;
			proxy_ignore_headers Vary Cache-Control Expires Set-Cookie;
			proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36";
			proxy_ssl_server_name on;
			proxy_ssl_name animesss.com;
			proxy_set_header Host animesss.com;
			proxy_set_header Accept-Encoding "";
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_store on;
			root /var/www/mirror;
			proxy_temp_path /var/www/proxy_temp;
		}

        # =====================================================================
        # Локация 3: МАСКИРОВКА ПОД САЙТ — СТАТИКА (Защищенное проксирование)
        # =====================================================================
        location ~ ^/(assets|cdn|aniserials|api|player)/ {
            access_log off;
            limit_req zone=assets burst=150 nodelay;

            # 1. REWRITE: Maps altered domain filenames back to original upstream filenames
            rewrite ^/(.*)(24-nl\.duckdns\.org|nl-24\.duckdns\.org)(.*)$ /$1animesss.com$3 break;

            # 2. DNS Resolver (IPv6 disabled to prevent 101 unreachable errors)
            proxy_pass https://animess_backend;

            proxy_ssl_server_name on;
            # Fixed SSL SNI hostname typo
            proxy_ssl_name animesss.com; 
           proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_ignore_headers Vary Cache-Control Expires Set-Cookie;
			proxy_ssl_session_reuse off;
            proxy_buffering on;
            proxy_request_buffering on;
            proxy_cache img_zone;
            proxy_cache_valid 200 206 304 365d;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504 http_403;

            # Подмена заголовков
            proxy_set_header Host animesss.com;
            proxy_cookie_domain animesss.com $host;
            proxy_set_header Referer https://animesss.com/;
            proxy_set_header Origin https://animesss.com;
           proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36";
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Accept-Encoding "";

            # Анонимизация
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Safe substitutions (Target ONLY text/html to prevent JS corruption)
            sub_filter 'https://animesss.com' 'https://$host';
			sub_filter 'http://animesss.com' 'http://$host';
			sub_filter '//animesss.com' '//$host';
			sub_filter '<div class="logo__title">Anime<span>SSS</span></div>' '<div class="logo__title">24-NL.<span>Duckdns.org</span></div>';
			sub_filter '<body class="' '<body class="dt-is-active dle_theme_dark" data-theme="dark" ';
			sub_filter '<body class="">' '<body class="dt-is-active dle_theme_dark" data-theme="dark">';
			sub_filter '<span class="footer__brand-name">Anime<span>SSS</span></span>' '<span class="footer__brand-name">24-NL.<span>Duckdns.org</span></span>';
            sub_filter 'AnimeSSS · AnimeStars · ASStars' '$host';
			sub_filter 'AnimeSSS - AnimeStars - ASStars' '$host';
			sub_filter 'АнимеСтарс' '$host';
            sub_filter_once off;
            sub_filter_types text/html;
        }
		# Блокировка и тихая обработка скриптов CDN
		location ^~ /cdn-cgi/ {
		
			default_type application/javascript;
			return 200 ""; #
    
			access_log off;
			error_log off;
		}

        # =====================================================================
        # Локация 4: МАСКИРОВКА — ГЛАВНАЯ СТРАНИЦА И КОРЕНЬ
        # =====================================================================
        location / {
            limit_req zone=bot burst=20 nodelay;
            limit_conn addr 20;

            proxy_pass https://animess_backend;

            proxy_ssl_server_name on;
            proxy_ssl_name animesss.com;
            proxy_http_version 1.1;
			proxy_ssl_session_reuse off;
            proxy_buffering on;
            proxy_request_buffering on;
			proxy_ignore_headers Vary Cache-Control Expires Set-Cookie;
            proxy_cache html_zone;
			proxy_cache_key "$scheme$proxy_host$request_uri";
			proxy_cache_valid 200 365d;
			proxy_cache_valid 301 302 1d;
			proxy_cache_valid 404 1d;
			proxy_cache_lock on;
			proxy_cache_background_update on;
			proxy_cache_revalidate off;
			proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504 http_403 http_429;

            proxy_set_header Host animesss.com;
            proxy_cookie_domain animesss.com $host;
            proxy_set_header Referer https://animesss.com/;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36";
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Accept-Encoding "";

            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto "";

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            sub_filter 'https://animesss.com' 'https://$host';
            sub_filter 'http://animesss.com' 'http://$host';
            sub_filter '//animesss.com' '//$host';
			sub_filter '<body class="' '<body class="dt-is-active dle_theme_dark" data-theme="dark" ';
			sub_filter '<body class="">' '<body class="dt-is-active dle_theme_dark" data-theme="dark">';
            sub_filter '<div class="logo__title">Anime<span>SSS</span></div>' '<div class="logo__title">24-NL.<span>Duckdns.org</span></div>';
			sub_filter '<span class="footer__brand-name">Anime<span>SSS</span></span>' '<span class="footer__brand-name">24-NL.<span>Duckdns.org</span></span>';
            sub_filter 'AnimeSSS · AnimeStars · ASStars' '$host';
			sub_filter 'AnimeSSS - AnimeStars - ASStars' '$host';
			sub_filter 'АнимеСтарс' '$host';
            sub_filter_once off;
            sub_filter_types text/html;
        }

       # =====================================================================
        # Локация 5: МЕДИА-СТРИМИНГ (Перенесено без изменений из first.conf)
        # =====================================================================
		# =====================================================================
        #  VLESS XHTTP Packet-UP
        # =====================================================================
        location /videos/media/ts/ { 
			set $limit_ip "";
		# 0-RTT и невалидные запросы сбрасываем в легитимный медиа-кэш
            if ($ssl_early_data) {
                return 425;			            
            # Проксирование через h2c
            proxy_pass http://xray_vless;
			# Нативный HTTP/2 к бэкенду
			proxy_http_version 2;

			# Полное отключение буферизации для двунаправленного потока
			proxy_buffering off;
			proxy_request_buffering off;
			gzip off;

			# Заголовки реального IP
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Таймауты туннеля
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
			client_body_timeout 1h;
			send_timeout 1h;
			proxy_socket_keepalive on;
			proxy_next_upstream off;
			client_max_body_size 0;
			client_body_buffer_size 256k;
			proxy_max_temp_file_size 0;
			# Логирование и маскировка
			access_log off;
			error_log /dev/null crit;
			proxy_intercept_errors on;
			error_page 400 502 503 504 =404 @notfound;
			}
		# =====================================================================
        #  VLESS WebSocket
        # =====================================================================
		location /videos/media/ts/720/ {
			set $limit_ip "";
		# 0-RTT и невалидные запросы сбрасываем в легитимный медиа-кэш
            if ($ssl_early_data) {
                return 425;	
		# Проксирование к Xray по HTTP/1.1
			proxy_pass http://xray_vless2;
			proxy_http_version 1.1;

			# WebSocket-заголовки
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Отключение буферизации для мгновенного отклика
			proxy_buffering off;
			proxy_request_buffering off;
			gzip off;

			# Таймауты туннеля (1 час)
			proxy_socket_keepalive on;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
			send_timeout 1h;
			client_max_body_size 0;

			# Логирование и маскировка ошибок
			access_log off;
			error_log /dev/null crit;
			error_page 400 502 503 504 =404 @notfound;
		}
		# =====================================================================
        #  VLESS XHTTP STREAM-ONE
        # =====================================================================
		location /videos/media/ts/1080/ { 
			set $limit_ip "";
		# 0-RTT и невалидные запросы сбрасываем в легитимный медиа-кэш
            if ($ssl_early_data) {
                return 425;		
            # Проксирование через h2c
			proxy_pass http://xray_vless3;

			# Нативный HTTP/2 к бэкенду
			proxy_http_version 2;

			# Полное отключение буферизации для двунаправленного потока
			proxy_buffering off;
			proxy_request_buffering off;
			gzip off;

			# Заголовки реального IP
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Таймауты туннеля
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
			client_body_timeout 1h;
			send_timeout 1h;
			proxy_socket_keepalive on;
			proxy_next_upstream off;
			client_max_body_size 0;
			client_body_buffer_size 256k;
			proxy_max_temp_file_size 0;
			# Логирование и маскировка
			access_log off;
			error_log /dev/null crit;
			proxy_intercept_errors on;
			error_page 400 502 503 504 =404 @notfound;
			}

        # =====================================================================
        # СЛУЖЕБНЫЕ БЛОКИ И СИСТЕМНЫЕ ЗАГЛУШКИ
        # =====================================================================
        location = /robots.txt {
			default_type text/plain;
			access_log off;
			return 200 "User-agent: *\nDisallow: /\n";
		}
		location = /favicon.ico {
            root /var/www/html;
            expires 30d;
            access_log off;
        }

        location = /.well-known/security.txt {
            default_type text/plain;
            access_log off;
            return 200 "Contact: mailto:admin@yourdomane.online\nPreferred-Languages: ru,en\n";
        }

        location @notfound {
            limit_req zone=scan burst=3 nodelay;
            root /var/www/html;
            rewrite ^ /404.html break;
        }
    }
}
